name: Dessin du keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.json"
      - "keymap_drawer.config.yaml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/corne_choc_pro.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"
      json_path: "config"
      # Ne dessiner que les trois couches utilisees : les couches EXTRA sont
      # vides et reservees a ZMK Studio, les afficher triple la hauteur du SVG.
      draw_args: "corne_choc_pro:'-s ERGOL NAVNUM SYS'"
      commit_message: "keymap-drawer : mise a jour du schema"
